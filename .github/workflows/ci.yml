name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # never let a stray credential leak into a test run
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  XAI_API_KEY: ""

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e ".[dev,mcp]"

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Types (core is strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

  golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install the checkout
        run: |
          uv venv
          uv pip install -e "."

      - name: Offline audit -> patch -> re-audit
        run: |
          export CONTROLX_HOME="$RUNNER_TEMP/controlx"
          uv run controlx init
          uv run controlx pack import examples/packs/demo-service
          uv run controlx pack import examples/packs/demo-thin
          # an insufficient target must fail the gate (exit 3)
          if uv run controlx audit run --source demo-service --target pack:demo-thin --min-score 70; then
            echo "expected exit 3 for an insufficient target" && exit 1
          fi
          uv run controlx patch preview latest
          uv run controlx patch apply latest --approve
          # after the patch it must clear the gate
          uv run controlx audit run --source demo-service --target pack:demo-thin --min-score 70

      - name: Build a wheel and install it outside the project
        # a separate venv, because `uv run` would re-sync the editable checkout
        # and hide whether the wheel really carries the example packs
        run: |
          uv build
          python3 -m venv "$RUNNER_TEMP/pkg"
          "$RUNNER_TEMP/pkg/bin/pip" install --quiet dist/*.whl

      - name: The packaged demo must run without the repo's examples/ folder
        run: |
          export CONTROLX_HOME="$RUNNER_TEMP/controlx-packaged"
          mv examples "$RUNNER_TEMP/examples-moved"
          "$RUNNER_TEMP/pkg/bin/controlx" demo
