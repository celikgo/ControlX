[project]
name = "controlx"
version = "0.1.0"
description = "Terminal-native engineering control plane for multi-project, multi-provider AI work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ControlX contributors" }]
keywords = ["llm", "prompt-engineering", "tui", "mcp", "openai", "anthropic", "xai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "keyring>=25.0",
  "cryptography>=42.0",
  "textual>=0.79",
  "rich>=13.7",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/celikgo/ControlX"
Documentation = "https://github.com/celikgo/ControlX/tree/main/docs"
Issues = "https://github.com/celikgo/ControlX/issues"

[project.scripts]
controlx = "controlx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlx"]

# `controlx demo` must work from a non-editable install (pipx / uv tool install),
# so the example packs travel inside the wheel as well as living in the repo.
[tool.hatch.build.targets.wheel.force-include]
"examples/packs" = "controlx/_examples/packs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src/controlx/core"]
strict = true
warn_unused_ignores = false
